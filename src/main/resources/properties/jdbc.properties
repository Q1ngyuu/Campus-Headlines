# ============================================================
#  数据库连接配置模板 —— 部署前请改成自己的真实信息
#  本文件不参与 Maven resources filtering，${} 不会被提前替换
# ============================================================

# ---------- JDBC 基础信息 ----------
# MySQL 8 驱动类（MySQL 5.x 也可以用这个驱动，无需改）
jdbc.driver=com.mysql.cj.jdbc.Driver
# 数据库名建议：campus_headlines
# 参数说明：
#   useUnicode/characterEncoding  解决中文乱码
#   useSSL=false                  本地开发关闭 SSL，避免警告
#   serverTimezone=Asia/Shanghai  必须与 MySQL 实际时区一致，否则时间差 8 小时
#   allowPublicKeyRetrieval=true  MySQL 8 的 caching_sha2_password 认证需要
#   nullCatalogMeansCurrent=true  避免 schema 匹配异常
jdbc.url=jdbc:mysql://localhost:3306/campus_headlines?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
jdbc.username=root
jdbc.password=请填写你的数据库密码

# ---------- Druid 连接池参数 ----------
druid.initialSize=5
druid.minIdle=5
druid.maxActive=20
# 获取连接的最大等待时间（毫秒）
druid.maxWait=60000
# stat：SQL 监控统计（生产环境建议保留）；可加 wall 做 SQL 防火墙，但语法限制较严
druid.filters=stat

# ============================================================
#  建库参考（在 MySQL 客户端执行）：
#
#  CREATE DATABASE IF NOT EXISTS campus_headlines
#      DEFAULT CHARACTER SET utf8mb4
#      COLLATE utf8mb4_general_ci;
# ============================================================
