# ============================================================
#  文件上传配置
#  路径用正斜杠，Windows 下也适用（D:/campus-upload 等价于 D:\campus-upload）
# ============================================================

# 上传文件的磁盘根目录（绝对路径）。
# 刻意放在 webapp 之外：war 重新部署不会清空用户上传的文件。
upload.base-path=D:/campus-upload

# 对外访问前缀。磁盘上的 D:/campus-upload/202610/xxx.jpg
# 对应浏览器地址 /campus-headlines/upload/202610/xxx.jpg
upload.url-prefix=/upload

# 单文件大小上限（字节）
# 图片 10MB，视频 50MB；这是代码层的二次校验，
# 第一道防线是 spring-mvc.xml 里 CommonsMultipartResolver 的 maxUploadSizePerFile
upload.max-image-size=10485760
upload.max-video-size=52428800

# 允许的扩展名白名单（小写、不含点，逗号分隔）
upload.image-ext=jpg,jpeg,png,gif,webp
upload.video-ext=mp4,webm,ogg
